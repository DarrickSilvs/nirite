[project]
name = "nirite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darrick", email = "darricksilvester@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.16.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
nirite = "nirite:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
